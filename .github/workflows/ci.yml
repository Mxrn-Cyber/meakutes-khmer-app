# Runs on every push and pull request. A red X on GitHub means something broke.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Website (lint, translations, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run build
      - name: Check the Cloudflare Worker script
        run: node --check worker/index.js

  backend:
    name: API (migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meakutes_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run all database migrations on a fresh MySQL
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/meakutes_ci
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: API tests
        run: pytest -q
